name: Build

on: [push]

jobs:
  build-cmake:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        include:
        - os: ubuntu-24.04
          package-file: DDNet-Server
          env:
            CFLAGS: -Wdeclaration-after-statement -Werror
            CXXFLAGS: -Werror
        - os: windows-2022
          package-file: DDNet-Server.exe
          env:
            CFLAGS: /WX
            CXXFLAGS: /WX
            LDFLAGS: /WX

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Prepare Linux
      if: contains(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update -y
        sudo apt-get install libsqlite3-dev cmake -y

    - name: Build in release mode
      run: |
        cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=./
        cmake --build ./ --config Release

    - name: Move release
      if: contains(matrix.os, 'windows')
      run: mv ./release/${{ matrix.package-file }} ./

    - name: Test release
      run: ./${{ matrix.package-file }} shutdown

    - name: Package
      run: |
        mkdir artifacts
        mv ${{ matrix.package-file }} artifacts

    - name: Package sqlite3.dll
      if: contains(matrix.os, 'windows')
      run: cp sqlite3.dll artifacts

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: hunter-${{ matrix.os }}-build-cmake
        path: artifacts