# Tee Asylum Expansion - 24 items, 6 modes
sv_name "Tee Asylum+ | 24装备 / 6模式"
sv_map "huntern_msc"
sv_port 8303
sv_register 0
sv_max_clients 64
sv_max_clients_per_ip 4
sv_tournament_mode 0
sv_pauseable 0
sv_room 1
sv_room_commands 1
sv_room_setting 0
sv_roomlist_votes 1
sv_roomlist_vote_title "=== 房间列表 ==="
sv_welcome "Tee Asylum+：24件装备，FFA/TDM/GG/ELIM/ZS/JGN！"
sv_motd "Tee Asylum+ / Item Asylum 风格扩展\n24件装备：7近战 + 9远程 + 8特殊\n按 1 / 2 / 3 切槽，左键使用\n投票菜单可切换六种模式或创建独立房间\nFFA混战 / TDM团队 / GG武器升级\nELIM三命淘汰 / ZS感染 / JGN巨人讨伐\n模式规则、身份、命数以聊天及屏幕提示为准"
sv_ddrace_rules 0
sv_rules_line1 "自由混战：每次出生随机三件装备，地图没有固定拾取。"
sv_rules_line2 "FFA击杀计分；TDM团队计分；GG升级；ELIM/JGN有命数；ZS死亡感染。"
sv_rules_line3 "弹药无限；特殊道具独立冷却；技能效果与图标以出生提示为准。"
logfile "asylum-server.log"
clear_gametypes
add_gametypefile "asylum" "huntern" "room_config/modes/asylum.rcfg"
add_gametypefile "asylum_tdm" "asylum_tdm" "room_config/modes/asylum_tdm.rcfg"
add_gametypefile "asylum_gg" "asylum_gg" "room_config/modes/asylum_gg.rcfg"
add_gametypefile "asylum_elim" "asylum_elim" "room_config/modes/asylum_elim.rcfg"
add_gametypefile "asylum_zs" "asylum_zs" "room_config/modes/asylum_zs.rcfg"
add_gametypefile "asylum_jgn" "asylum_jgn" "room_config/modes/asylum_jgn.rcfg"
sv_lobby_override_config "room_config/lobby.rcfg"
add_vote "=== 创建房间 ===" "info"
add_vote "FFA 自由混战" "create asylum"
add_vote "TDM 团队死斗" "create asylum_tdm"
add_vote "GG 武器升级赛" "create asylum_gg"
add_vote "ELIM 三命淘汰" "create asylum_elim"
add_vote "ZS 感染生存" "create asylum_zs"
add_vote "JGN 巨人讨伐" "create asylum_jgn"
